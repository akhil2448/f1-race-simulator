@if (loading) {
  <div class="loading-container">
    <div class="loading-spinner"></div>

    <div class="loading-text">Building race performance analysis...</div>

    <div class="loading-subtext">
      Loading lap data, track status and telemetry.
    </div>
  </div>
}

@if (!loading && analysis) {
  <app-race-performance-chart [analysisData]="analysis" />
}
