<div class="race-controls">
  <app-button
    size="xs"
    variant="secondary"
    [active]="isPreRace || activeTemporaryMode === 'TYRE'"
    (clicked)="showTyre()"
  >
    {{ isMobileLandscape ? "TYRE\nAGE" : "TYRE AGE" }}
  </app-button>

  <app-button
    size="xs"
    variant="secondary"
    [disabled]="isPreRace"
    [active]="activeTemporaryMode === 'PIT'"
    (clicked)="showPit()"
  >
    {{ isMobileLandscape ? "PITSTOP\nCOUNT" : "PITSTOP COUNT" }}
  </app-button>

  <app-button
    size="xs"
    variant="secondary"
    [disabled]="isPreRace"
    [active]="activeTemporaryMode === 'LAPPED'"
    (clicked)="showLapped()"
  >
    {{ isMobileLandscape ? "GAP TO\nLEADER" : "GAP TO LEADER" }}
  </app-button>

  <app-button
    size="xs"
    variant="secondary"
    [disabled]="isPreRace"
    [active]="activeTemporaryMode === 'GAINED_LOST'"
    (clicked)="showGainLoss()"
  >
    {{ isMobileLandscape ? "GAINED\nLOST" : "GAINED/LOST" }}
  </app-button>
</div>
